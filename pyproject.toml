[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loca-bench"
dynamic = ["version"]
description = 'LOCA-bench: Benchmarking Language Agents Under Controllable and Extreme Context Growth'
readme = "README.md"
# 3.12 only: the pinned numpy/pandas versions below require >=3.12, and
# mcp_convert already hard-requires >=3.12. Failing loudly here beats silently
# resolving a different dependency set on a node with an older interpreter.
requires-python = ">=3.12,<3.13"
keywords = ["language-agents", "long-context", "benchmarking", "llm", "context-management"]
authors = [
  { name = "LOCA-bench Contributors" },
]
maintainers = [
  { name = "LOCA-bench Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
# All runtime dependencies are pinned to exact, verified-working versions.
# Rationale: floating specs ("pkg", "pkg>=X") silently pick up breaking releases
# on every fresh node install. Two concrete failures this guards against:
#   * fastmcp>=2.0.0 now resolves to 3.4.5 (fastmcp-slim based). excel-mcp-server
#     0.1.8 pins fastmcp<3, so the resolver *downgrades* it to 0.1.5 instead ->
#     the excel MCP server misbehaves and tool discovery times out.
#   * mcp 2.0.0 removed the low-level Server decorator API; anything pulling it
#     in transitively (excel-mcp-server needs mcp[cli]>=1.10.1) crashes at
#     startup, which surfaces as a 120s MCP discovery timeout.
# To refresh the set: install into a clean venv, verify a task run, then copy the
# resulting versions back here.
dependencies = [
  # Core dependencies
  "nltk==3.9.1",
  "math-verify[antlr4_13_2]==0.9.0",
  "reasoning-gym==0.1.23",
  "msgspec==0.19.0",
  "pylatexenc==2.11",
  "transformers==5.14.1",
  "datasets==5.0.1",
  # CLI and utilities
  "fire==0.7.1",
  "typer[all]==0.27.0",
  "python-dotenv==1.2.2",
  "tiktoken==0.13.0",
  "uv==0.12.0",
  # Data processing
  "pandas==3.0.5",
  "numpy==2.5.1",
  "cryptography==49.0.0",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "reportlab==5.0.0",
  "ruff==0.16.0",
  "black==26.5.1",
  "mypy==2.3.0",
  # MCP stack -- keep these three consistent. fastmcp must stay 2.x and mcp must
  # stay 1.x; `mcp` is listed explicitly (not just transitively) so it can never
  # float up to 2.x behind our back.
  "fastmcp==2.14.7",
  "mcp==1.29.0",
  "excel-mcp-server==0.1.8",
  "pyyaml==6.0.3",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  # PTC kernel (verl-aligned StatefulSandbox in programmatic_tool_calling)
  "ipykernel==7.3.0",
  "jupyter_client==8.9.1",
]

[project.optional-dependencies]
# Search functionality
search = [
  "mosec",
  "aiohttp",
  "bs4",
  "chardet",
  "google-api-python-client",
  "torch",
  "torchvision",
  "torchaudio",
  "pyserini",
]

# WebShop environment (disabled - conflicts with fastmcp/excel-mcp-server via typer)
# Install separately if needed: pip install spacy==3.7.2 beautifulsoup4==4.11.1 ...
# webshop = [
#   "beautifulsoup4==4.11.1",
#   "cleantext==1.1.4",
#   "Flask==2.1.2",
#   "pyserini==0.17.0",
#   "PyYAML==6.0.2",
#   "rank_bm25==0.2.2",
#   "requests==2.27.1",
#   "rich==12.4.4",
#   "selenium==4.2.0",
#   "spacy==3.7.2",
#   "thefuzz==0.19.0",
#   "pydantic==2.10.6",
#   "Werkzeug==2.1.0",
# ]

[project.urls]
Homepage = "https://github.com/hkust-nlp/LOCA-bench"
Documentation = "https://github.com/hkust-nlp/LOCA-bench"
Issues = "https://github.com/hkust-nlp/LOCA-bench/issues"
Source = "https://github.com/hkust-nlp/LOCA-bench"

[project.license]
text = "MIT"

[project.scripts]
loca = "loca.cli.main:app"

[tool.hatch.version]
path = "gem/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["gem", "mcp_convert", "loca"]

[tool.hatch.envs.types]
extra-dependencies = ["mypy==2.3.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:gem tests}"

[tool.coverage.run]
source_pkgs = ["gem", "tests"]
branch = true
parallel = true
omit = ["gem/__about__.py"]

[tool.coverage.paths]
gem = ["gem", "*/gem/gem"]
tests = ["tests", "*/gem/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pylint.master]
load-plugins = "pylint.extensions.docparams,pylint.extensions.docstyle,pylint.extensions.no_self_use"
default-docstring-type = "google"
ignore-paths = ["gem/__about__.py"]

[tool.pylint.format]
max-line-length = 88
indent-after-paren = 4
indent-string = "    "

[tool.pylint.imports]
known-third-party = "wandb"

[tool.pylint.reports]
output-format = "colorized"
reports = "no"
score = "yes"
max-args = 7

[tool.pylint.messages_control]
disable = [
  "W0201",
  "W0108",
  "W0212",
  "W1514",
  "R0902",
  "R0903",
  "R0913",
  "R0914",
  "R0915",
  "R1719",
  "R1732",
  "R0801",
  "C0103",
  "C3001",
  "C0116",
  "W0106",
  "R0912",
  "R1702",
  "W0640",
  "W1203",
  "R0402",
  "C0199",
  "R6301",
  "C0301",
  "W0105",
  "C0115",
  "W0621",
  "C0415",
  "W0621",
  "E0401",
]

[tool.yapf]
based_on_style = "yapf"
spaces_before_comment = 4
dedent_closing_brackets = true
column_limit = 88
continuation_indent_width = 4

[tool.isort]
profile = "black"
multi_line_output = 3
indent = 4
line_length = 88
known_third_party = "wandb"

[tool.mypy]
files = "gem/**/*.py"
allow_redefinition = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
show_error_context = true
show_traceback = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

[tool.pydocstyle]
ignore = [
  "D100",
  "D102",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D401",
  "D402",
]
