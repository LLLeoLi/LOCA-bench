# Excel MCP Server Configuration
name: excel
display_name: Excel MCP Server
description: Excel file manipulation server

# Launched through run_confined.py instead of the upstream `excel-mcp-server`
# console script: in stdio mode upstream ignores EXCEL_FILES_PATH entirely
# (absolute paths accepted as-is => writes anywhere). The wrapper re-enables
# the containment check and moves the server's file log into the workspace.
execution:
  command_type: python
  script:
    primary: "gem/tools/mcp_server/excel/run_confined.py"

parameters:
  excel_files_path:
    required: false
    default: "."
    env_var: "EXCEL_FILES_PATH"
    aliases:
      - agent_workspace
    description: "Path to Excel files directory"

  env_vars:
    required: false
    description: "Optional dictionary of additional environment variables to set"

workspace:
  set_cwd: true
  cwd_param: excel_files_path
  supports_placeholders: true
  mkdir_if_needed: true
  # Defense-in-depth on top of the run_confined.py path check.
  confine_writes: true
