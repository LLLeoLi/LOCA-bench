# Memory Tool MCP Server Configuration
name: memory_tool
display_name: Memory Tool MCP Server
description: Persistent memory storage for agents

execution:
  command_type: python
  script:
    primary: "gem/tools/mcp_server/memory_tool/server.py"
    fallbacks: []

parameters:
  base_path:
    required: false
    default: "./memory_storage"
    cli_arg: "--base-path"
    description: "Base path for memory storage"

workspace:
  # Task reset can remove base_path after config creation, before discovery.
  # The server uses --base-path and creates its storage on first access;
  # it must not require that storage directory to exist at process startup.
  set_cwd: false
  supports_placeholders: true
